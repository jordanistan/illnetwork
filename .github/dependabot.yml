      time: "08:45"
      timezone: "America/Chicago"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/Illnet-Rx"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/Chicago"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(compose)"
      include: "scope"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker-compose"
    directory: "/Illnet-Rx"
