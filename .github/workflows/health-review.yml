name: Health content review gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/portfolio/health/**'
      - '.github/workflows/health-review.yml'
      - 'portfolio/health_review.py'
      - 'portfolio/test_health_review.py'
      - 'portfolio/sites.json'
      - 'portfolio/build.py'
      - 'portfolio/check.py'
      - 'portfolio/assets/site.css'
      - 'portfolio/assets/site.js'
  push:
    branches: [main]
    paths:
      - '.github/portfolio/health/**'
      - '.github/workflows/health-review.yml'
      - 'portfolio/health_review.py'
      - 'portfolio/test_health_review.py'
      - 'portfolio/sites.json'
      - 'portfolio/build.py'
      - 'portfolio/check.py'
      - 'portfolio/assets/site.css'
      - 'portfolio/assets/site.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: health-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test review boundaries
        run: python3 -m unittest portfolio.test_health_review -v
      - name: Validate official sources, content and pending evidence
        run: |
          python3 portfolio/health_review.py sources
          python3 portfolio/health_review.py content
          python3 portfolio/health_review.py evidence
